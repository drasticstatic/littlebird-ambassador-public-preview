<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="t d">
  <title id="t">Littlebird Ambassador</title>
  <desc id="d">Context engine for the agent fleet: always-on observation, one morning brief at a time. The picture: a sun held by an open circle, and 4 waves drawing in beneath it. With reduced motion, the finished picture shows at once.</desc>
  <style>
    /* Motion only for readers who have not asked for less. Outside this block everything is in its finished state. */
    @media (prefers-reduced-motion: no-preference) {
      .draw { stroke-dasharray: 100; animation: draw 2.6s cubic-bezier(.4,0,.2,1) both; }
      .arrive { animation: arrive .5s ease-out both; }
      .breathe { transform-box: fill-box; transform-origin: center; animation: breathe 8s steps(48) 3s infinite; }
      .halo { transform-box: fill-box; transform-origin: center; animation: halo 5s steps(60) 3.6s infinite; }
    }
    @keyframes draw { from { stroke-dashoffset: 100 } to { stroke-dashoffset: 0 } }
    @keyframes arrive { from { opacity: 0 } to { opacity: 1 } }
    @keyframes breathe { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.07) } }
    @keyframes halo { 0% { opacity: .55; transform: scale(1) } 70%, 100% { opacity: 0; transform: scale(2.1) } }
    .halo { opacity: 0 }
  </style>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a1a2e"/><stop offset="1" stop-color="#0f3460"/></linearGradient>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="668" y1="0" x2="1160" y2="0"><stop offset="0.00" stop-color="#804c5a"/><stop offset="0.50" stop-color="#b87082"/><stop offset="1.00" stop-color="#ddb5bf"/></linearGradient>
    <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="620" y1="0" x2="1200" y2="0"><stop offset="0" stop-color="#b87082" stop-opacity="0"/><stop offset=".35" stop-color="#b87082"/><stop offset="1" stop-color="#ddb5bf"/></linearGradient>
    <clipPath id="card"><rect width="1200" height="260" rx="18"/></clipPath>
    <radialGradient id="ember" gradientUnits="userSpaceOnUse" cx="962" cy="124" r="390"><stop offset="0" stop-color="#800020" stop-opacity=".8"/><stop offset=".6" stop-color="#5c1a2b" stop-opacity=".45"/><stop offset="1" stop-color="#5c1a2b" stop-opacity="0"/></radialGradient>
  </defs>
  <g clip-path="url(#card)">
    <!-- an opaque ground: the same picture on GitHub's light and dark themes -->
    <rect width="1200" height="260" fill="url(#ground)"/>
    <rect width="1200" height="260" fill="url(#ember)"/>
    <circle class="breathe" cx="965.8" cy="101.0" r="46" fill="url(#line)"/>
    <path class="draw" pathLength="100" d="M1020.1 63.4A66 66 0 1 1 960.4 35.2" fill="none" stroke="#b87082" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:0.20s"/>
    <path class="draw" pathLength="100" d="M620 164.0Q690.7 177.7 761.5 164.0Q832.2 150.3 902.9 164.0Q973.7 177.7 1044.4 164.0Q1115.1 150.3 1185.9 164.0Q1256.6 177.7 1327.3 164.0" fill="none" stroke="url(#fade)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:0.40s"/>
    <path class="draw" pathLength="100" d="M620 183.3Q679.9 166.6 739.9 183.3Q799.8 200.1 859.8 183.3Q919.7 166.6 979.6 183.3Q1039.6 200.1 1099.5 183.3Q1159.5 166.6 1219.4 183.3Q1279.4 200.1 1339.3 183.3" fill="none" stroke="url(#fade)" stroke-width="2.8000000000000003" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:0.90s"/>
    <path class="draw" pathLength="100" d="M620 202.7Q694.9 221.8 769.9 202.7Q844.8 183.6 919.7 202.7Q994.7 221.8 1069.6 202.7Q1144.6 183.6 1219.5 202.7Q1294.4 221.8 1369.4 202.7" fill="none" stroke="url(#fade)" stroke-width="2.4000000000000004" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:1.40s"/>
    <path class="draw" pathLength="100" d="M620 222.0Q685.6 240.0 751.2 222.0Q816.8 204.0 882.4 222.0Q948.1 240.0 1013.7 222.0Q1079.3 204.0 1144.9 222.0Q1210.5 240.0 1276.1 222.0" fill="none" stroke="url(#fade)" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:1.90s"/>
    <rect x="0.0" y="248" width="300.5" height="12" fill="#1a1a2e"/><rect x="300.0" y="248" width="300.5" height="12" fill="#5c1a2b"/><rect x="600.0" y="248" width="300.5" height="12" fill="#800020"/><rect x="900.0" y="248" width="300.5" height="12" fill="#fbeef1"/>
    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><text x="56" y="61.1" fill="#c78f9d" font-size="15" font-weight="700" letter-spacing=".6">drasticstatic lab · context engine</text><text x="56" y="119.0" fill="#fbeef1" font-size="52" font-weight="700" letter-spacing="-.5">Littlebird Ambassador</text><text x="56" y="161.5" fill="#dcd0d6" font-size="23">Context engine for the agent fleet: always-on</text><text x="56" y="192.3" fill="#dcd0d6" font-size="23">observation, one morning brief at a time.</text></g>
  </g>
</svg>
